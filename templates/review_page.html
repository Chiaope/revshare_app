<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Selector</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --radius: 14px;
        }
        * { box-sizing: border-box; min-width: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: clamp(14px, 1.6vw, 16px);
            line-height: 1.5;
        }
        .container {
            width: min(1200px, 95vw);
            margin-inline: auto;
            padding: clamp(16px, 4vw, 32px);
        }
        header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: clamp(16px, 3vw, 28px);
        }
        h1 {
            font-size: clamp(20px, 3.2vw, 28px);
            font-weight: 650;
            margin: 0;
            flex: 1 1 auto;
        }
        form {
            display: flex;
            flex-direction: column;   /* stack sections vertically */
            gap: 24px;
            width: 100%;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: clamp(16px, 2.5vw, 24px);
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .card h2 {
            font-size: clamp(15px, 2vw, 17px);
            margin: 0 0 14px;
            font-weight: 600;
        }
        .qa { margin-bottom: 16px; }
        .qa-question {
            font-size: 0.85em;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .qa-answer {
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            overflow-wrap: anywhere;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .qa-answer.empty { color: var(--muted); font-style: italic; }
        .field { margin-bottom: 16px; }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 0.95em;
        }
        label.required::after { content:" *"; color:#dc2626; }
        input, select, textarea {
            width: 100%;
            max-width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font: inherit;
            background: white;
        }
        input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
        .actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 550;
            cursor: pointer;
            width: auto;
        }
        button:disabled { opacity: .6; cursor: not-allowed; }
        @media (max-width: 480px) {
            .actions { justify-content: stretch; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Select a Pending Response</h1>
        </header>

        <form id="submit_form" action="/submit" method="POST">
            <section class="card" aria-labelledby="ext-h">
                <h2 id="ext-h">Review</h2>
                {% for question_answer in form_data %}
                <input type="hidden" name="{{ question_answer.question }}" value="{{ question_answer.answer }}">
                <div class="qa">
                    <div class="qa-question">{{ question_answer.question }}</div>
                    {% if not question_answer.answer %}
                        <div class="qa-answer empty">No answer provided.</div>
                    {% else %}
                        <div class="qa-answer">{{ question_answer.answer }}</div>
                    {% endif %}
                </div>
                {% endfor %}
            </section>

            <section class="card" aria-labelledby="int-h">
                <h2 id="int-h">Remarks</h2>
                <div class="field">
                    <textarea id="remarks" name="remarks" rows="4" required></textarea>
                </div>
            </section>

            <section class="card" aria-labelledby="int-h">
                <h2 id="int-h">Update status</h2>
                <div class="field">
                    <select id="selected_status" name="selected_status" required>
                        <option value="" disabled selected>Select a status</option>
                        {% for status in available_status %}
                        <option value="{{ status }}">{{ status }}</option>
                        {% endfor %}
                    </select>
                </div>
            </section>

            <div class="actions">
                <button id="submit_button" type="submit">Submit</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('submit_form').addEventListener('submit', function() {
            var submitButton = document.getElementById('submit_button');
            
            // Disable the button
            submitButton.disabled = true;
            
            // Optional: Change the text to give the user feedback
            submitButton.innerText = 'Loading...';
        });
    </script>
</body>
</html>
